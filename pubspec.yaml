name: expenseful
description: "A playful, no-bank-integration expense tracker with a coin jar metaphor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local storage (Drift = SQL layer over sqlite)
  drift: ^2.20.1
  drift_flutter: ^0.2.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase (Auth only — identity, no cloud sync)
  firebase_core: ^3.3.0
  firebase_auth: ^5.2.0

  # Charts (Insights screen)
  fl_chart: ^0.68.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.2

  # Fonts — fetches Google Fonts at runtime (cached after first load),
  # no manual .ttf files needed. See docs/FONTS.md for production notes.
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  drift_dev: ^2.20.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/